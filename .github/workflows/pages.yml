# Builds the site and publishes it to GitHub Pages.
# One-time setup in GitHub: Settings > Pages > Build and deployment > Source: GitHub Actions.
# Base path: https://shailesh-stha.github.io/shailesh-stha/ needs "/shailesh-stha/" (the default below).
# With a custom domain, set the repository variable SITE_BASE to "/" (Settings > Secrets and variables > Actions > Variables).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE: ${{ vars.SITE_BASE || '/shailesh-stha/' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/prepare-pages.mjs build/client "$SITE_BASE"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
